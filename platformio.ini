[platformio]
default_envs = xiao_joystick

[env]
platform = platformio/espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    platformio/tool-esptoolpy@2.41100.0
upload_protocol = esptool
upload_speed = 460800
; Native CDC changes from the application port to the ROM bootloader port.
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
monitor_speed = 115200
; The board manifest defaults to hardware USB Serial/JTAG (mode 1).
; Mode 0 selects native USB-OTG/TinyUSB, required by USBHIDGamepad.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_PRODUCT=\"XIAO_FPV_Joystick\"

[env:xiao_joystick]
build_flags =
    ${env.build_flags}
    -DJOYSTICK_TEST_MODE=0

[env:xiao_axis_test]
build_flags =
    ${env.build_flags}
    -DJOYSTICK_TEST_MODE=1
