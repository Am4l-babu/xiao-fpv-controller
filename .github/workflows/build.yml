name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build both firmware modes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and helper dependencies
        run: python -m pip install platformio==6.2.0 -r requirements.txt
      - name: Check Python helper syntax
        run: python -m compileall -q tools
      - name: Compile joystick and axis-test firmware
        run: pio run -e xiao_joystick -e xiao_axis_test
      - name: Package firmware images
        run: |
          mkdir -p firmware/joystick firmware/axis-test
          cp .pio/build/xiao_joystick/{firmware,bootloader,partitions}.bin firmware/joystick/
          cp .pio/build/xiao_axis_test/{firmware,bootloader,partitions}.bin firmware/axis-test/
      - uses: actions/upload-artifact@v4
        with:
          name: xiao-fpv-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 14
